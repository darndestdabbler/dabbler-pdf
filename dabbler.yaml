# dabbler.yaml -- what this repository declares about itself.
#
# Tracked, unlike local-overrides.yaml, because CI reads these facts and so
# does the next machine to pick up a session. Precedence is the packaged
# router-config.yaml, then this file, then local-overrides.yaml. Providers,
# models, roles and transports are deliberately absent: those are
# distribution facts, and a repository that restated them here would fork
# the model registry in order to say how to run a test suite.
schema_version: 1

# Which tests answer for which path, and what proves the suite was green.
# Nothing runs the selected tests before verification: the tests that run
# are each step's own checks, and the complete suite is recorded once,
# against the final verified tree. The Primary Reviewer reviews without
# or running one. The selection is what the record NAMES as affected by a
# change, and what `dabbler affected` prints.
#
# One suite per ecosystem whose root build file says how its tests run, so
# a repository that is Java and .NET at once hands each runner its own
# tests. Check the command before you rely on it: it is read from what this
# repository already carries, and a repository can carry a runner it does
# not actually use. One field is the scaffold's, not yours to keep:
#
#   covers      claims the whole repository, because setup cannot know this
#               layout. The failure direction is fixed -- run a suite you
#               did not need rather than skip one you did -- so narrow it as
#               the layout settles.
#
# A source file's tests are the tests named after it, and two fields say
# how that reads here:
#
#   test_name   the name a source file's tests take, `{name}` standing for
#               its stem: CsvSerializer.cs is tested by CsvSerializerTests.cs.
#   select      the command that runs a selection: `{names}` the selected
#               test classes joined by `select_separator`, `{paths}` their
#               files. A suite without it runs whole.
#
# Beside the suites, `controls` are the deterministic checks that run
# before every verification round, one entry per kind -- compile,
# typecheck, lint, analyzer -- each a `command` (argv for `node`, never a
# shim like `npm`) whose exit code is the fact; `required: true` sends a red
# result back to the author instead of buying a reviewer's opinion on it:
#
#   controls:
#     - kind: typecheck
#       command: node scripts/typecheck.mjs
#       required: true
testing:
  suites:
    - name: dotnet
      command: dotnet test DabblerPdf.slnx --blame-hang-timeout 5m
      expensive: true
      covers:
        - src
        - tests
        - DabblerPdf.Samples
      test_roots:
        - tests
      test_glob: "*Tests.cs"
      test_name: "{name}Tests.cs"
      select: dotnet test DabblerPdf.slnx --blame-hang-timeout 5m --filter {names}
      select_separator: "|"

  # A source file with no test named after it is shown to the reviewer,
  # and runs the smoke tests where the repository declares some -- a few
  # broad tests that notice a structural break:
  #
  #   selection:
  #     smoke:
  #       - tests/Csv.Tests/SmokeTests.cs

# Pack only: the version is the csproj's <Version>, which the CI gate reads.
# No push is declared because nuget.org publication is CI's, on a
# nuget-v<version> tag.
packaging:
  pack:
    argv: ["dotnet", "pack", "src/DabblerPdf/DabblerPdf.csproj", "-c", "Release", "-o", "{output}"]
