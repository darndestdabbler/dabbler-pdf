name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build DabblerPdf.slnx -c Release --no-restore
      - run: dotnet test DabblerPdf.slnx -c Release --no-build --blame-hang-timeout 5m
